status:
  scope: >-
    Proved for finite simple graphs (any universe), under the hypotheses of each statement: the
    clique form for every k ≥ 3 (maximum degree at most k, no (k+1)-clique); the classical form
    for finite connected graphs that are neither complete nor odd cycles; (version 2) the
    degree-choosability equivalence for every finite connected graph (colours in ℕ), Brooks'
    theorem for lists for finite connected graphs that are neither complete nor odd cycles (any
    colour type), and the block results for every finite graph (the block–cut tree for connected
    graphs).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs from the formal statements and proof plans: one run for version 1;
        for version 2, one run for the degree-choosability results (reusing the version-1 Brooks
        theorem) and one run for the block library (proposed by the author); each return was
        audited (statements and headers unchanged, libraries unchanged, no added axioms) and
        rebuilt locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design (for version 2: the encoding of Gallai trees by induced 2-connected
        subgraphs and the block statements, checked by brute force on all graphs with at most 7,
        resp. 6, vertices), proof plans, integration and review of the Aristotle returns, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical
    elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    None in substance. "Complete" is `G = ⊤`, "odd cycle" is an isomorphism with Mathlib's
    `cycleGraph n` for odd n, colourability is Mathlib's `Colorable`; the clique form uses
    `CliqueFree (k + 1)` and `maxDegree ≤ k`. Version 2: lists are finsets indexed by vertices; in
    the degree-choosability equivalence the colours are natural numbers (with too few colours the
    equivalence would fail), while Brooks' theorem for lists holds for any colour type. A block is
    a maximal vertex set S such that G[S] is connected and, when |S| ≥ 3, G[S − x] is connected for
    every x ∈ S (so bridges and isolated vertices are blocks); a cut vertex separates two vertices
    that are joined in G; the block–cut graph has the blocks and the cut vertices as vertices.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Brooks' theorem, checked that the Aristotle return left every
    statement and header unchanged, and confirmed by `lake build`, `#print axioms` and a
    comparison of the fully elaborated Challenge and Solution types that the proofs use no
    `sorry` and only propext, Classical.choice and Quot.sound. The author directed the work and
    approved the statements. No independent human mathematical review has been performed. The
    result is classical; no mathematical novelty is claimed.

