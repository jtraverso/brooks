version: "v0.4"

project:
  name: "Brooks' theorem, degree-choosability and blocks"
  description: >-
    A Lean 4 / Mathlib formalization of Brooks' theorem: for k ≥ 3, a finite graph of maximum
    degree at most k without a (k+1)-clique is k-colourable (no connectedness assumption), and a
    finite connected graph that is neither complete nor an odd cycle is colourable with as many
    colours as its maximum degree. The proof uses greedy colourings in Lovász's style and an
    induction on the number of edges with a separation-and-gluing step. Version 2 adds the
    Erdős–Rubin–Taylor / Borodin theorem (a finite connected graph is degree-choosable, i.e.
    colourable from any lists with |L(v)| ≥ deg(v), if and only if it is not a Gallai tree: some
    block is neither complete nor an odd cycle), Brooks' theorem for lists (Vizing 1976), and a
    library of blocks of graphs (blocks as maximal nonseparable vertex sets, cut vertices, unique
    block per edge, blocks meeting in at most one vertex, the block–cut tree of a connected graph,
    and the agreement of the block and induced-subgraph descriptions of Gallai trees).
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

